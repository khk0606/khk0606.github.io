  - .devcontainer
  - _publications
  - _talks
  - _teaching
  - _portfolio
  - markdown_generator
  - talkmap
  - talkmap.ipynb
  - talkmap.py
  - talkmap_out.ipynb
  - cv
  - scripts
  - tmp
  - local
  - log
  - vendor
  - node_modules
  - assets/js/_main.js
  - assets/js/plugins
