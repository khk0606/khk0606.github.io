# Personal Academic Pages — https://khk0606.github.io
locale: en-US
site_theme: default
title: Hyunkyu Kang
title_separator: "|"
name: &name Hyunkyu Kang
description: &description "Undergraduate at Chung-Ang University studying human-scene interaction, motion generation, and embodied AI."
url: https://khk0606.github.io
baseurl: ""
repository: khk0606/khk0606.github.io
author:
  name: Hyunkyu Kang
  avatar:
  bio: "Human–scene interaction · Motion generation · Embodied AI"
  location: South Korea
  employer: Chung-Ang University
  email: khk0606@naver.com
  github: khk0606
breadcrumbs: false
